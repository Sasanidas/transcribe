[project]
name = "transcribe"
version = "0.1.0"
description = "Real-time local Google Meet transcription with Japanese->English translation"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.1",
    "sherpa-onnx>=1.10",
    "soundfile>=0.12",
    "numpy>=1.26",
    "huggingface_hub>=0.24",
    "nvidia-cublas-cu12>=12.9.3.13",
    "nvidia-cudnn-cu12>=9,<10",
    "nvidia-cuda-runtime-cu12>=12.9.79",
    "google-api-python-client>=2.202.0",
    "google-auth-oauthlib>=1.5.0",
]
